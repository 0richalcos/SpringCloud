server:
  port: 9995

spring:
  application:
    name: category
  cloud:
    consul:
      host: localhost
      port: 8500

feign:
  client:
    config:
      product:
        # 配置指定服务连接超时
        connect-timeout: 5000
        # 配置指定服务等待超时
        read-timeout: 5000
        # 开启指定服务日志展示
        logger-level: full

logging:
  level:
    com.orichalcos.feignclient: debug