server.port=7878
spring.application.name=config-server
spring.cloud.consul.host=localhost
spring.cloud.consul.port=8500
# 指定仓库的url
spring.cloud.config.server.git.uri=https://github.com/0richalcos/SpringCloud.git
# 指定访问的分支
spring.cloud.config.server.git.default-label=master
# 检索路径
spring.cloud.config.server.git.search-paths=/springcloud_parent/springcloud_config_server/src/main/resources/config
# 私有仓库访问用户名
#spring.cloud.config.server.git.username=
# 私有仓库访问密码
#spring.cloud.config.server.git.password=