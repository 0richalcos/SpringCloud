spring:
  cloud:
    config:
      discovery:
        # 是否通过服务发现寻找 Config Server
        enabled: true
        # Config Server 的服务 ID
        service-id: config-server
      # 指定从仓库的哪个分支拉取配置
      label: master
      # 指定拉取配置文件的名称
      name: config-client
      # 指定拉取配置文件的环境
      profile: dev
      # 开启连接远程服务失败报错
      fail-fast: true

management:
  endpoints:
    web:
      exposure:
        # 暴露配置刷新、健康检查等 Web 管理端点
        include: refresh,health,info