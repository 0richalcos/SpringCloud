server:
  # 执行服务端口
  port: 8888

spring:
  application:
    # 指定服务名称，唯一标识
    name: eureka-client

eureka:
  client:
    # Eureka 注册中心地址
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    # 续约更新时间间隔（默认 30 秒）
    lease-renewal-interval-in-seconds: 3
    # 续约到期时间（默认 90 秒）
    lease-expiration-duration-in-seconds: 10